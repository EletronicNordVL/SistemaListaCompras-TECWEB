<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras - Cadastro de Produtos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sistema de Lista de Compras</h1>
        <nav>
            <a href="cadastro.html" class="active">Cadastro</a>
            <a href="lista.html">Lista de Compras</a>
        </nav>
    </header>

    <main>
        <section class="cadastro-section">
            <h2>Cadastro de Produtos</h2>
            
            <form id="formProduto" class="produto-form">
                <div class="form-group">
                    <label for="nomeProduto">Nome do Produto*:</label>
                    <input type="text" id="nomeProduto" name="nomeProduto" required>
                </div>

                <div class="form-group">
                    <label for="unidade">Unidade*:</label>
                    <select id="unidade" name="unidade" required>
                        <option value="">Selecione a unidade</option>
                        <option value="un">Unidade</option>
                        <option value="kg">Quilograma</option>
                        <option value="lt">Litro</option>
                        <option value="mt">Metro</option>
                        <option value="pc">Pacote</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantidade">Quantidade*:</label>
                    <input type="number" id="quantidade" name="quantidade" min="1" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="codigoBarra">Código de Barra:</label>
                    <input type="text" id="codigoBarra" name="codigoBarra" maxlength="13" pattern="[0-9]{13}">
                    <small>Deve conter 13 dígitos numéricos</small>
                </div>

                <div class="form-group checkbox-group">
                    <label for="ativo">
                        <input type="checkbox" id="ativo" name="ativo" checked>
                        Produto Ativo
                    </label>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="btnSalvar">Cadastrar Produto</button>
                    <button type="button" id="btnCancelar">Cancelar</button>
                </div>
            </form>
        </section>

        <section class="listagem-section">
            <h2>Produtos Cadastrados</h2>
            <div class="busca-container">
                <input type="text" id="campoBusca" placeholder="Buscar produto...">
            </div>
            
            <div class="tabela-container">
                <table id="tabelaProdutos">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th>Unidade</th>
                            <th>Quantidade</th>
                            <th>Código de Barra</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela">
                        <!-- Produtos serão inseridos aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Sistema de Lista de Compras. Todos os direitos reservados.</p>
    </footer>

    <script src="cadastro.js"></script>
</body>
</html>
